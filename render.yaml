services:
  # CampusBite Express Backend API Service
  - type: web
    name: campusbite-api
    env: node
    plan: free
    buildCommand: "npm --prefix server install"
    startCommand: "npm --prefix server start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  # CampusBite React Frontend Static Site
  - type: web
    name: campusbite-client
    env: static
    plan: free
    buildCommand: "npm --prefix client install && npm --prefix client run build"
    staticPublishPath: "./client/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
