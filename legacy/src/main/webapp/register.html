<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ByteBite Campus Canteen</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden text-slate-100">

    <!-- Ambient Glowing Orbs -->
    <div class="fixed top-1/4 right-1/4 w-80 h-80 bg-orange-600/20 rounded-full blur-[100px] pointer-events-none animate-float"></div>
    <div class="fixed bottom-1/4 left-1/4 w-96 h-96 bg-amber-600/20 rounded-full blur-[120px] pointer-events-none animate-float" style="animation-delay: -3s;"></div>

    <!-- Register Card -->
    <div class="relative z-10 w-full max-w-lg p-8 sm:p-10 rounded-3xl bg-slate-900/85 backdrop-blur-xl border border-white/10 shadow-2xl shadow-black/60 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 text-white text-2xl shadow-lg shadow-orange-500/30 mb-1">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">
                Join Byte<span class="text-orange-500">Bite</span>
            </h1>
            <p class="text-xs sm:text-sm font-semibold text-slate-400">
                Order meals in advance & skip the campus food lines
            </p>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="hidden"></div>

        <!-- Register Form -->
        <form onsubmit="handleRegister(event)" class="space-y-4">
            
            <!-- Full Name -->
            <div class="space-y-1.5">
                <label for="reg-name" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    Full Name
                </label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="text" 
                        id="reg-name" 
                        required 
                        placeholder="e.g. Maya Patel" 
                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                    >
                </div>
            </div>

            <!-- College Email -->
            <div class="space-y-1.5">
                <label for="reg-email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    College / Campus Email
                </label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="email" 
                        id="reg-email" 
                        required 
                        placeholder="e.g. student@bytebite.edu" 
                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                    >
                </div>
            </div>

            <!-- Role Selector -->
            <div class="space-y-1.5">
                <label for="reg-role" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    Campus Role
                </label>
                <div class="relative">
                    <i class="fas fa-id-badge absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <select 
                        id="reg-role" 
                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium appearance-none cursor-pointer"
                    >
                        <option value="student" selected>Student (Food Pre-Order Portal)</option>
                        <option value="faculty">Faculty / Staff Member</option>
                        <option value="staff">Canteen Kitchen Staff / Counter Admin</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                </div>
            </div>

            <!-- Passwords Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label for="reg-password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Password
                    </label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input 
                            type="password" 
                            id="reg-password" 
                            required 
                            placeholder="••••••••" 
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                        >
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="confirm-password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Confirm
                    </label>
                    <div class="relative">
                        <i class="fas fa-check-double absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            required 
                            placeholder="••••••••" 
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                        >
                    </div>
                </div>
            </div>

            <!-- Register Button -->
            <button 
                type="submit" 
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 transition-all flex items-center justify-center gap-2 pt-3.5"
            >
                <span>Create My Account</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="pt-2 text-center text-xs font-semibold text-slate-400 border-t border-slate-800">
            Already have an account? 
            <a href="login.html" class="text-orange-400 hover:text-orange-300 font-bold underline underline-offset-4 ml-1">
                Log In
            </a>
        </div>
    </div>

    <!-- Script imports -->
    <script src="js/auth.js"></script>
</body>
</html>
