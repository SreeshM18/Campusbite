<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ByteBite Campus Canteen</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden text-slate-100">

    <!-- Ambient Glowing Orbs -->
    <div class="fixed top-1/4 left-1/4 w-80 h-80 bg-orange-600/20 rounded-full blur-[100px] pointer-events-none animate-float"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-amber-600/20 rounded-full blur-[120px] pointer-events-none animate-float" style="animation-delay: -3s;"></div>

    <!-- Login Container Card -->
    <div class="relative z-10 w-full max-w-md p-8 sm:p-10 rounded-3xl bg-slate-900/85 backdrop-blur-xl border border-white/10 shadow-2xl shadow-black/60 space-y-6">
        
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 text-white text-2xl shadow-lg shadow-orange-500/30 mb-2">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 class="text-3xl font-black tracking-tight text-white">
                Byte<span class="text-orange-500">Bite</span>
            </h1>
            <p class="text-xs sm:text-sm font-semibold text-slate-400">
                Smart Campus Dining & Fast Pre-Order System
            </p>
        </div>

        <!-- Inline Notification Message Box -->
        <div id="authAlert" class="hidden"></div>

        <!-- Quick Demo Switcher -->
        <div class="p-3 rounded-2xl bg-slate-800/80 border border-slate-700/80 space-y-2">
            <div class="text-[11px] font-black uppercase tracking-wider text-slate-400 flex items-center justify-between">
                <span>⚡ 1-Click Demo Login</span>
                <span class="text-orange-400">Instant Access</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button 
                    type="button" 
                    onclick="fillDemoCredentials('student'); handleLogin();"
                    class="px-3 py-2 rounded-xl bg-slate-700/70 hover:bg-orange-600 text-slate-200 hover:text-white text-xs font-bold transition-all flex items-center justify-center gap-1.5 border border-slate-600 hover:border-orange-500"
                >
                    <i class="fas fa-graduation-cap text-amber-400"></i> Student
                </button>
                <button 
                    type="button" 
                    onclick="fillDemoCredentials('staff'); handleLogin();"
                    class="px-3 py-2 rounded-xl bg-slate-700/70 hover:bg-orange-600 text-slate-200 hover:text-white text-xs font-bold transition-all flex items-center justify-center gap-1.5 border border-slate-600 hover:border-orange-500"
                >
                    <i class="fas fa-concierge-bell text-orange-400"></i> Staff/Chef
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- Email Input -->
            <div class="space-y-1.5">
                <label for="login-email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                    College Email
                </label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="email" 
                        id="login-email" 
                        required 
                        placeholder="e.g. student@bytebite.edu" 
                        class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                        Password
                    </label>
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input 
                        type="password" 
                        id="login-password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full pl-11 pr-11 py-3 rounded-2xl bg-slate-800/90 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition-all font-medium"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-sm p-1"
                    >
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 transition-all flex items-center justify-center gap-2 pt-3.5"
            >
                <span>Sign In to ByteBite</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer Links -->
        <div class="pt-2 text-center text-xs font-semibold text-slate-400 border-t border-slate-800">
            Don't have an account? 
            <a href="register.html" class="text-orange-400 hover:text-orange-300 font-bold underline underline-offset-4 ml-1">
                Register here
            </a>
        </div>
    </div>

    <!-- Script imports -->
    <script src="js/auth.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
