name: "✨ Feature Request"
description: "Suggest a new feature or enhancement for CampusBite"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CampusBite better for students or canteen staff? We would love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or campus dining friction?
      placeholder: A clear description of the challenge or opportunity.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Detailed description of what you want to happen.
      placeholder: Describe the feature, UI/UX flow, or backend logic.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context / Mockups
      description: Add any mockups, diagrams, or references here.
    validations:
      required: false
